name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/redglow-v7
  workflow_dispatch:

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze source
        run: |
          set +e
          flutter analyze 2>&1 | tee flutter-analyze.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload analyzer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyze-log
          path: flutter-analyze.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Run tests
        run: |
          set +e
          flutter test 2>&1 | tee flutter-test.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-log
          path: flutter-test.log
          if-no-files-found: ignore
          retention-days: 7

  android-beta:
    name: Build Android beta APK
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build installable beta APK
        run: flutter build apk --debug

      - name: Upload beta APK
        uses: actions/upload-artifact@v4
        with:
          name: redglow-v7.0.5-android
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
