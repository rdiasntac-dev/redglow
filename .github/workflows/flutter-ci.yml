name: Flutter CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/redglow-v7
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate branded launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze source
        run: |
          set +e
          flutter analyze 2>&1 | tee flutter-analyze.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload analyzer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-analyze-log
          path: flutter-analyze.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Run tests
        run: |
          set +e
          flutter test 2>&1 | tee flutter-test.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-test-log
          path: flutter-test.log
          if-no-files-found: ignore
          retention-days: 7

  android-beta:
    name: Build Android beta APK
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate branded launcher icons
        run: dart run flutter_launcher_icons

      - name: Build installable beta APK
        run: flutter build apk --release

      - name: Upload beta APK
        uses: actions/upload-artifact@v4
        with:
          name: redglow-v7.0.9-android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish shareable GitHub beta
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/redglow-v7'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk REDGLOW-v7.0.9-beta.apk
          if gh release view v7.0.9-beta >/dev/null 2>&1; then
            gh release upload v7.0.9-beta REDGLOW-v7.0.9-beta.apk --clobber
          else
            gh release create v7.0.9-beta REDGLOW-v7.0.9-beta.apk \
              --target "$GITHUB_SHA" \
              --title "REDGLOW 7.0.9 Beta" \
              --prerelease \
              --notes "Beta fechado para testes funcionais do ciclo cliente-prestadora. Pagamentos, saques e cobranças permanecem apenas simulados. Não use documentos reais nos testes."
          fi
